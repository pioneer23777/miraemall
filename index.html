<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>미래몰 · 테스트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root {
    --bg: #efe4d4;
    --ink: #1c1612;
    --muted: #7a6d60;
    --line: #e4d5c2;
    --card: #fffaf3;
    --accent: #b8432f;
    --accent-ink: #fff8f2;
    --boss: #8d5a1a;
    --staff: #2f5d50;
    --ok: #2c6b45;
    --wait: #9a6420;
    --shadow: 0 16px 40px rgba(70, 42, 18, 0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Pretendard, "Apple SD Gothic Neo", sans-serif;
    background:
      radial-gradient(900px 420px at 10% -10%, #f7e7cf 0%, transparent 55%),
      linear-gradient(180deg, #f3e7d6, var(--bg));
    color: var(--ink);
  }
  button, input, select { font-family: inherit; }
  button { cursor: pointer; }
  .app {
    width: min(440px, 100%);
    min-height: 100%;
    margin: 0 auto;
    background: #f7f1e7;
    position: relative;
    box-shadow: var(--shadow);
  }
  .screen { display: none; min-height: 100vh; }
  .screen.on { display: block; }
  .auth {
    padding: 28px 22px 40px;
  }
  .mark {
    display: flex; align-items: center; gap: 10px; margin-bottom: 22px;
  }
  .seal {
    width: 42px; height: 42px; border-radius: 14px;
    background: var(--ink); color: #f4e2c4;
    display: grid; place-items: center; font-weight: 800; letter-spacing: -0.04em;
  }
  .mark b { font-size: 20px; letter-spacing: -0.04em; }
  .mark span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  h1 { font-size: 28px; line-height: 1.25; letter-spacing: -0.045em; margin: 0 0 8px; }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 22px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 6px; }
  input, select {
    width: 100%; border: 1px solid var(--line); background: white;
    border-radius: 12px; padding: 13px 14px; font-size: 15px; color: var(--ink);
  }
  input:focus, select:focus { outline: 2px solid #e7c7a4; border-color: #d7b48a; }
  .btn {
    width: 100%; border: 0; border-radius: 14px; padding: 14px 16px;
    font-size: 15px; font-weight: 700; letter-spacing: -0.03em;
  }
  .btn.primary { background: var(--ink); color: #f6eadc; margin-top: 16px; }
  .btn.ghost { background: transparent; color: var(--ink); margin-top: 8px; }
  .btn.accent { background: var(--accent); color: var(--accent-ink); }
  .btn.line { background: white; border: 1px solid var(--line); color: var(--ink); }
  .btn.small { width: auto; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  .btn:disabled { opacity: 0.45; }
  .demo {
    margin-top: 22px; background: #fff; border-radius: 16px; padding: 14px;
    border: 1px dashed #e0d0bc;
  }
  .demo p { margin: 0 0 8px; font-size: 12px; color: var(--muted); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); background: #fffaf3; border-radius: 999px;
    padding: 7px 10px; font-size: 12px;
  }
  .note { font-size: 12px; color: var(--muted); line-height: 1.45; margin-top: 14px; }
  .top {
    position: sticky; top: 0; z-index: 5;
    background: rgba(247, 241, 231, 0.94); backdrop-filter: blur(10px);
    padding: 14px 16px 10px; border-bottom: 1px solid transparent;
  }
  .top row, .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .who { font-size: 13px; color: var(--muted); }
  .who b { color: var(--ink); }
  .role {
    font-size: 11px; font-weight: 700; border-radius: 999px; padding: 3px 8px; color: white;
  }
  .role.boss { background: var(--boss); }
  .role.staff { background: var(--staff); }
  .role.customer { background: var(--accent); }
  .cats {
    display: flex; gap: 4px; padding: 4px 0 2px;
  }
  .cat {
    flex: 1 1 0; min-width: 0; border: 0; background: white; color: var(--ink); border-radius: 999px;
    padding: 7px 0; font-weight: 700; font-size: 11px; letter-spacing: -0.05em;
    white-space: nowrap; text-align: center;
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .cat.on { background: var(--ink); color: #f6eadc; box-shadow: none; }
  .pad { padding: 8px 16px 110px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card {
    background: var(--card); border-radius: 18px; overflow: hidden;
    box-shadow: 0 8px 20px rgba(70, 42, 18, 0.05);
  }
  .card img, .ph {
    width: 100%; height: 110px; object-fit: cover; display: block; background: #efe2d2;
  }
  .ph { display: grid; place-items: center; color: #8a7562; font-weight: 800; letter-spacing: -0.04em; }
  .card .meta { padding: 10px 12px 12px; }
  .card .meta b { display: block; font-size: 14px; letter-spacing: -0.03em; }
  .card .meta span { color: var(--muted); font-size: 13px; }
  .add {
    margin-top: 8px; width: 100%; border: 0; border-radius: 10px;
    background: #f3e6d6; color: var(--ink); padding: 8px; font-weight: 700;
  }
  .tabs { display: flex; gap: 6px; margin-top: 10px; }
  .tab {
    flex: 1; border: 0; background: transparent; color: var(--muted);
    padding: 8px 4px; font-weight: 700; border-bottom: 2px solid transparent;
  }
  .tab.on { color: var(--ink); border-color: var(--ink); }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .item {
    background: white; border-radius: 16px; padding: 14px;
    box-shadow: 0 8px 20px rgba(70, 42, 18, 0.04);
  }
  .item h3 { margin: 0 0 4px; font-size: 15px; letter-spacing: -0.03em; }
  .item p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px;
    padding: 3px 7px; background: #f4e7d4; color: var(--wait);
  }
  .badge.ok { background: #e5f2e8; color: var(--ok); }
  .badge.no { background: #f8e4df; color: var(--accent); }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .cart {
    position: sticky; bottom: 0; background: var(--ink); color: #f6eadc;
    margin: 0 12px 12px; border-radius: 18px; padding: 14px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .cart button { width: auto; margin: 0; background: #f6eadc; color: var(--ink); }
  .overlay {
    position: fixed; inset: 0; background: rgba(28, 22, 18, 0.46);
    display: none; align-items: flex-end; justify-content: center; z-index: 20;
  }
  .overlay.on { display: flex; }
  .sheet {
    width: min(440px, 100%); background: #fffaf3; border-radius: 22px 22px 0 0;
    padding: 18px 16px 28px; max-height: 86vh; overflow: auto;
  }
  .sync {
    position: fixed; inset: 0; background: #1c1612; color: #f6eadc;
    display: none; place-items: center; z-index: 30; text-align: center; padding: 24px;
  }
  .sync.on { display: grid; }
  .sync b { font-size: 22px; letter-spacing: -0.04em; }
  .sync span { color: #cbbba6; font-size: 14px; }
  .empty { text-align: center; color: var(--muted); padding: 28px 10px; font-size: 14px; }
  .qty { display: flex; align-items: center; gap: 8px; }
  .qty button {
    width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: white;
  }
  .split { display: flex; gap: 8px; }
  .split .btn { margin-top: 0; }
  .photo-row { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  .photo-row img { width: 64px; height: 64px; object-fit: cover; border-radius: 12px; background: #efe2d2; }
  .warn { background: #fff4e8; border-radius: 12px; padding: 10px 12px; font-size: 13px; color: #7a4e16; }
  #mileChip { font-size: 11px; font-weight: 700; color: #8d5a1a; }
  .check { display: flex; align-items: center; gap: 8px; margin: 12px 0; font-size: 14px; }
  .check input { width: auto; }

  .totals { margin-top: 12px; background: white; border-radius: 16px; padding: 12px 14px; }
  .totals div { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; color: #7a6d60; }
  .totals div.sum { color: #1c1612; font-weight: 800; border-top: 1px solid #e4d5c2; margin-top: 4px; padding-top: 10px; }
  .acct { background: #1c1612; color: #f6eadc; border-radius: 16px; padding: 14px; margin: 8px 0 14px; }
  .acct b { display: block; font-size: 20px; letter-spacing: -0.03em; margin-top: 4px; }

  .heart-pop {
    position: fixed; z-index: 80; pointer-events: none; line-height: 1;
    animation: heartFloat .75s ease-out forwards;
  }
  @keyframes heartFloat {
    0% { transform: translate(0, 0) scale(0.3); opacity: 1; }
    100% { transform: translate(var(--dx), -64px) scale(1.15); opacity: 0; }
  }

  .star { border: 0; background: transparent; color: #c4a15a; font-size: 16px; padding: 0 4px 0 0; line-height: 1; }
  .star.on { color: #d39b12; }
  .name-line { display: flex; align-items: center; }
  .pick { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 8px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style id="printCss">
#printArea{display:none}
@media print{html,body{background:#fff!important;padding:0!important;margin:0!important}body>*:not(#printArea){display:none!important}#printArea{display:block!important;color:#111;font-family:'Noto Sans CJK KR',sans-serif}
#printArea table{border-collapse:collapse;width:100%}#printArea td,#printArea th{border:1px solid #999;padding:3px 6px;font-size:12px}#printArea th{background:#eee}#printArea .r{text-align:right}

<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />

<meta name="apple-mobile-web-app-capable" content="yes" />

<body>
<div class="app">
  <section class="screen on" id="auth">
    <div class="auth">
      <div class="mark"><div class="seal">미</div><div><b>미래몰</b><span>테스트 · 이 브라우저에만 저장</span></div></div>
      <h1 id="authTitle">로그인</h1>
      <p class="sub" id="authSub">사장, 직원, 고객이 한 주소에서 권한만 다르게 들어옵니다.</p>
      <div id="loginBox">
        <label>휴대폰 번호</label>
        <input id="loginPhone" inputmode="numeric" placeholder="01012345678" />
        <label>비밀번호</label>
        <input id="loginPw" type="password" placeholder="비밀번호" />
        <button class="btn primary" id="loginBtn">로그인 · 업데이트 확인</button>
        <button class="btn ghost" id="toJoin">고객 회원가입</button>
        <div id="pwaHint" hidden></div>
      </div>
      <div id="joinBox" style="display:none">
        <label>상호 또는 이름</label>
        <input id="joinName" placeholder="예: 홍대점" />
        <label>휴대폰 번호</label>
        <input id="joinPhone" inputmode="numeric" placeholder="01012345678" />
        <label>비밀번호</label>
        <input id="joinPw" type="password" placeholder="4자 이상" />
        <p class="note">인증번호는 보내지 않습니다. 사장 또는 직원이 승인하면 이 번호로 로그인됩니다.</p>
        <button class="btn primary" id="joinBtn">가입 신청</button>
        <button class="btn ghost" id="toLogin">로그인으로</button>
      </div>
    </div>
  </section>

  <section class="screen" id="main">
    <div class="top">
      <div class="row">
        <div class="who">미래몰 · <b id="userName"></b> <span class="role" id="userRole"></span> <span id="mileChip"></span></div>
        <span><button class="btn line small" id="pwBtn">비밀번호 변경</button> <button class="btn line small" id="logoutBtn">나가기</button></span>
      </div>
      <div class="cats" id="cats"></div>
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="pad" id="body"></div>
  </section>
</div>

<div class="sync" id="sync">
  <div>
    <b>업데이트 확인 중</b><br />
    <span id="syncMsg">최신 메뉴와 승인 내역을 불러오는 중입니다.</span>
  </div>
</div>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>

<script>
const KEY = "baljupan-test-v4";
const ROLE = { boss: "사장", staff: "직원", customer: "고객" };

const seed = () => ({
  version: 1,
  users: [],
  categories: [
    { id: "c-drink", name: "음료", status: "active", order: 1 },
    { id: "c-alc", name: "주류", status: "active", order: 2 },
    { id: "c-etc", name: "그외", status: "active", order: 3 }
  ],
  menus: [
    { id: "m1", categoryId: "c-drink", name: "콜라", price: 2000, mileage: 20, photo: "", status: "active" },
    { id: "m2", categoryId: "c-drink", name: "사이다", price: 2000, mileage: 20, photo: "", status: "active" },
    { id: "m3", categoryId: "c-alc", name: "카스", price: 5000, mileage: 50, photo: "", status: "active" },
    { id: "m4", categoryId: "c-alc", name: "참이슬", price: 5000, mileage: 50, photo: "", status: "active" },
    { id: "m5", categoryId: "c-etc", name: "마른안주", price: 8000, mileage: 80, photo: "", status: "active" }
  ],
  requests: [],
  orders: [],
  posts: [
    { id: "n1", kind: "notice", title: "배송 안내", body: "오후 4시 이전 발주는 다음날 도착합니다.", at: Date.now(), by: "사장" },
    { id: "e1", kind: "event", title: "주류 적립 2배", body: "이번 주 주류 발주는 마일리지가 두 배입니다.", at: Date.now(), by: "사장" }
  ],
  popup: { title: "미래몰 안내", body: "신규 거래처 첫 발주 마일리지를 확인해 주세요." },
  changelog: ["기본 분류 음료, 주류, 그외가 준비되어 있습니다."]
});

let db = load();
let session = null;
let tab = "order";
let cat = "c-drink";
let cart = [];
let pickQty = {};
let usePoints = false;
let lastSyncNotes = [];

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return seed();
    const parsed = JSON.parse(raw);
    if (!parsed.categories || !parsed.users) return seed();
    parsed.posts = parsed.posts || [];
    parsed.popup = parsed.popup || { title: "미래몰 안내", body: "신규 거래처 첫 발주 마일리지를 확인해 주세요." };
    return parsed;
  } catch (e) {
    return seed();
  }
}
function save() { localStorage.setItem(KEY, JSON.stringify(db)); cloudPush(); }
function uid(p) { return p + Math.random().toString(36).slice(2, 8); }
function won(n) { return Number(n || 0).toLocaleString("ko-KR") + "원"; }
function pt(n) { return Number(n || 0).toLocaleString("ko-KR") + "P"; }
function mileOf(m) { return Number(m && m.mileage) || 0; }
function phone(v) { return String(v || "").replace(/\D/g, ""); }
function fmtPhone(p) { p = phone(p); return p.length === 11 ? p.slice(0,3) + "-" + p.slice(3,7) + "-" + p.slice(7) : p.length === 10 ? p.slice(0,3) + "-" + p.slice(3,6) + "-" + p.slice(6) : p; }
function showPhone(p) { p = phone(p); if (session && session.role === "staff") return p.slice(0,3) + "-****-" + p.slice(-4); return fmtPhone(p); }
function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}
function when(t) {
  const d = new Date(t);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

function activeCats() { return db.categories.filter(c => c.status === "active").sort((a,b) => a.order - b.order); }
function activeMenus(cid) { return db.menus.filter(m => m.status === "active" && m.categoryId === cid); }

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  document.getElementById(id).classList.add("on");
}
function openSheet(html) {
  document.getElementById("sheet").innerHTML = html;
  document.getElementById("overlay").classList.add("on");
}
function closeSheet() { document.getElementById("overlay").classList.remove("on"); }
document.getElementById("overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeSheet(); });

function syncThen(next) {
  const box = document.getElementById("sync");
  const msg = document.getElementById("syncMsg");
  box.classList.add("on");
  msg.textContent = "최신 메뉴와 승인 내역을 확인하고 있습니다.";
  setTimeout(async () => {
    try { if (!(await cloudPull())) db = load(); } catch (e) { db = load(); }
    if (session) { const me = db.users.find(u => u.id === session.id); if (me) session = me; }
    const notes = db.changelog.slice(-3);
    lastSyncNotes = notes;
    msg.textContent = notes.length ? notes[notes.length - 1] : "새 업데이트 없이 최신 상태입니다.";
    setTimeout(() => {
      box.classList.remove("on");
      next();
    }, 700);
  }, 650);
}

function enter() {
  show("main");
  tab = session.role === "customer" ? "order" : "orders";
  cat = "all";
  cart = [];
  pickQty = {};
  usePoints = false;
  render();
  maybeShowAd();
}
function todayKey() {
  const d = new Date();
  return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}
function maybeShowAd() {
  const popup = db.popup || {};
  if (!popup.body) return;
  const hidden = localStorage.getItem("miraemall-ad-hide-" + session.id);
  if (hidden === todayKey()) return;
  openSheet(`<h2>${esc(popup.title || "안내")}</h2><p class="sub">${esc(popup.body)}</p>
    <div class="split">
      <button class="btn line" id="hideToday">오늘하루 안보기</button>
      <button class="btn primary" id="closeAd">닫기</button>
    </div>`);
  document.getElementById("hideToday").onclick = () => {
    localStorage.setItem("miraemall-ad-hide-" + session.id, todayKey());
    closeSheet();
  };
  document.getElementById("closeAd").onclick = closeSheet;
}

document.getElementById("loginBtn").onclick = async () => {
  const p = phone(document.getElementById("loginPhone").value);
  const pw = document.getElementById("loginPw").value;
  let user;
  if (cloud.ok) {
    let r; try { r = await cloudLogin(p, pw); } catch (e) { return alert("서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요."); }
    user = r.user || (r.error === "pending" || r.error === "rejected" ? { status: r.error } : null);
  } else user = db.users.find(u => u.phone === p && u.pw === pw);
  if (!user) return alert("번호 또는 비밀번호가 맞지 않습니다.");
  if (user.status === "pending") return alert("가입 승인 대기 중입니다. 사장 또는 직원이 승인하면 로그인됩니다.");
  if (user.status === "rejected") return alert("가입이 거절된 번호입니다.");
  session = user;
  syncThen(enter);
};
document.getElementById("toJoin").onclick = () => {
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("joinBox").style.display = "block";
  document.getElementById("authTitle").textContent = "고객 가입";

    const order = {
      id: uid("o"), userId: session.id, name: session.name, phone: session.phone,

/* ===== 출력 (영수증 80mm / A4 모아찍기 / A4 품목별 합계) ===== */
let printDate = "";
const printPick = new Set();
function ymd(t) { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function hm(t) { const d = new Date(t); return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); }
function orderNo(o) { const day = ymd(o.at); const same = db.orders.filter(x => ymd(x.at) === day).sort((a,b) => a.at - b.at); return day.replace(/-/g,"") + "-" + String(same.indexOf(o) + 1).padStart(3,"0"); }
function n0(n) { return Number(n || 0).toLocaleString("ko-KR"); }
function printSet() {
  if (!printDate) printDate = ymd(Date.now());
  const day = db.orders.filter(o => ymd(o.at) === printDate);
  const picked = day.filter(o => printPick.has(o.id));
  return (picked.length ? picked : day).slice().sort((a,b) => a.at - b.at);
}
function printBar() {
  if (!printDate) printDate = ymd(Date.now());
  return `<div class="actions" style="margin:0 0 10px;flex-wrap:wrap;align-items:center">
    <input type="date" id="printDate" value="${printDate}" style="width:auto;margin:0" />
    <button class="btn line small" id="printMulti">A4 모아찍기</button>
    <button class="btn line small" id="printSum">A4 품목별 합계</button></div>
    <p class="note" style="margin-top:0">체크한 주문이 있으면 그 주문만, 없으면 선택한 날짜 주문 전체를 출력합니다.</p>`;

function approve(id) {
  const r = db.requests.find(x => x.id === id);
  if (r.type === "category") {
    db.categories.push({ id: uid("c"), name: r.name, status: "active", order: db.categories.length + 1 });
    bump("분류 '" + r.name + "'가 승인되어 반영되었습니다.");
  } else if (r.type === "menu") {
    db.menus.push({ id: uid("m"), categoryId: r.categoryId, name: r.name, price: r.price, mileage: Number(r.mileage) || 0, photo: r.photo || "", status: "active" });
    bump("메뉴 '" + r.name + "'가 승인되어 반영되었습니다.");
  } else if (r.type === "mileage") {
    const m = db.menus.find(x => x.id === r.menuId);
    if (m) { m.mileage = Number(r.mileage) || 0; bump(m.name + " 마일리지 " + pt(m.mileage) + "가 승인되었습니다."); }
    else save();
  } else if (r.type === "photo") {
    const m = db.menus.find(x => x.id === r.menuId);
    if (m) { m.photo = r.photo; bump(m.name + " 사진이 승인되어 바뀌었습니다."); }
    else save();
  }
  r.status = "approved";
  save(); render();
}
function bump(text) {
  db.version += 1;
  db.changelog.push(text);
  save();
}
function compress(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, 640 / img.width);
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL("image/jpeg", 0.72));
    };
    img.onerror = reject;
    img.src = url;
  });
}

}
function renderHometax() {

    try { await htSaveKv("hometax_pending", list); render(); } catch (e) { alert("저장 실패: " + (e.message || e)); }
  };
  document.querySelectorAll("[data-htok]").forEach(b => b.onclick = () => mark(+b.dataset.htok, "확인됨"));
  document.querySelectorAll("[data-htno]").forEach(b => b.onclick = () => {
    const memo = prompt("틀린 내용을 적어 주세요"); if (memo === null) return; mark(+b.dataset.htno, "틀림", memo);

  document.querySelectorAll("[data-htdone]").forEach(b => b.onclick = () => {

  });

const CLOUD_COLLS = ["users","categories","menus","requests","orders","posts"];

function cloudMsg(t) {
  let el = document.getElementById("cloudMsg");
  if (!el) { el = document.createElement("div"); el.id = "cloudMsg";
    el.style.cssText = "position:fixed;left:8px;right:8px;bottom:8px;z-index:9999;background:#fff3cd;color:#7a5a00;border:1px solid #e6d28a;border-radius:8px;padding:6px 10px;font-size:12px;text-align:center";
    document.body.appendChild(el); }

function cloudRows(d) {
  const rows = {};
  CLOUD_COLLS.forEach(c => (d[c] || []).forEach((x, i) => { if (x && x.id != null) rows[c + "\u0001" + x.id] = { coll: c, id: String(x.id), pos: i, data: x }; }));
  Object.entries(d.favorites || {}).forEach(([k, v]) => rows["favorites\u0001" + k] = { coll: "favorites", id: k, pos: 0, data: v });
  CLOUD_KV.forEach(k => { if (d[k] !== undefined) rows["kv\u0001" + k] = { kv: true, key: k, value: d[k] }; });
  return rows;
}
function cloudSnap(d) { const s = {}; Object.entries(cloudRows(d)).forEach(([k, r]) => s[k] = JSON.stringify(r)); return s; }
function cloudToken() { return localStorage.getItem("mm-token") || ""; }
let cloudQueue = Promise.resolve();
function cloudPush() {
  if (!cloud.ok || !cloudToken()) return;
  const rows = cloudRows(db), now = {}, up = [], kv = [], del = [];
  Object.entries(rows).forEach(([k, r]) => { now[k] = JSON.stringify(r);
    if (cloud.snap[k] !== now[k]) { if (r.kv) kv.push({ key: r.key, value: r.value }); else up.push({ coll: r.coll, id: r.id, pos: r.pos, data: r.data }); } });
  Object.keys(cloud.snap).forEach(k => { if (!now[k] && !k.startsWith("kv\u0001")) del.push(k.split("\u0001")); });
  cloud.snap = now;
  if (!up.length && !kv.length && !del.length) return;
  cloudQueue = cloudQueue.then(async () => {
    const r = await cloud.sb.rpc("mm_save", { p_token: cloudToken(), p_rows: up, p_kv: kv, p_dels: del });
    if (r.error) throw r.error;
    cloudMsg(""); cloudRefresh();
  }).catch(e => { console.warn(e); cloudMsg("온라인 저장에 실패했습니다. (" + (e.message || e) + ")"); });
}
async function cloudPull() {
  if (!cloud.ok || !cloudToken()) return false;
  const r = await cloud.sb.rpc("mm_fetch", { p_token: cloudToken() });
  if (r.error) { if (/AUTH/.test(r.error.message || "")) localStorage.removeItem("mm-token"); throw r.error; }
  const d = r.data; delete d.me;
  CLOUD_COLLS.forEach(c => d[c] = d[c] || []);
  d.favorites = d.favorites || {}; d.changelog = d.changelog || []; d.version = d.version || 1;

function cloudRefresh() {
  clearTimeout(cloud.timer);
  cloud.timer = setTimeout(async () => {
    try { if (!(await cloudPull())) return; } catch (e) { return; }
    const ae = document.activeElement, typing = ae && /INPUT|SELECT|TEXTAREA/.test(ae.tagName);
    const sheetOpen = document.getElementById("overlay").classList.contains("on");

async function cloudLogin(p, pw) {
  const r = await cloud.sb.rpc("mm_login", { p_phone: p, p_pw: pw });

async function cloudInit() {

    if (!window.supabase || SUPABASE_URL.startsWith("__")) throw new Error("설정 없음");

  }
}
