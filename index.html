<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>미래몰 · 테스트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root {
    --bg: #efe4d4;
    --ink: #1c1612;
    --muted: #7a6d60;
    --line: #e4d5c2;
    --card: #fffaf3;
    --accent: #b8432f;
    --accent-ink: #fff8f2;
    --boss: #8d5a1a;
    --staff: #2f5d50;
    --ok: #2c6b45;
    --wait: #9a6420;
    --shadow: 0 16px 40px rgba(70, 42, 18, 0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Pretendard, "Apple SD Gothic Neo", sans-serif;
    background:
      radial-gradient(900px 420px at 10% -10%, #f7e7cf 0%, transparent 55%),
      linear-gradient(180deg, #f3e7d6, var(--bg));
    color: var(--ink);
  }
  button, input, select { font-family: inherit; }
  button { cursor: pointer; }
  .app {
    width: min(440px, 100%);
    min-height: 100%;
    margin: 0 auto;
    background: #f7f1e7;
    position: relative;
    box-shadow: var(--shadow);
  }
  .screen { display: none; min-height: 100vh; }
  .screen.on { display: block; }
  .auth {
    padding: 28px 22px 40px;
  }
  .mark {
    display: flex; align-items: center; gap: 10px; margin-bottom: 22px;
  }
  .seal {
    width: 42px; height: 42px; border-radius: 14px;
    background: var(--ink); color: #f4e2c4;
    display: grid; place-items: center; font-weight: 800; letter-spacing: -0.04em;
  }
  .mark b { font-size: 20px; letter-spacing: -0.04em; }
  .mark span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  h1 { font-size: 28px; line-height: 1.25; letter-spacing: -0.045em; margin: 0 0 8px; }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 22px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 6px; }
  input, select {
    width: 100%; border: 1px solid var(--line); background: white;
    border-radius: 12px; padding: 13px 14px; font-size: 15px; color: var(--ink);
  }
  input:focus, select:focus { outline: 2px solid #e7c7a4; border-color: #d7b48a; }
  .btn {
    width: 100%; border: 0; border-radius: 14px; padding: 14px 16px;
    font-size: 15px; font-weight: 700; letter-spacing: -0.03em;
  }
  .btn.primary { background: var(--ink); color: #f6eadc; margin-top: 16px; }
  .btn.ghost { background: transparent; color: var(--ink); margin-top: 8px; }
  .btn.accent { background: var(--accent); color: var(--accent-ink); }
  .btn.line { background: white; border: 1px solid var(--line); color: var(--ink); }
  .btn.small { width: auto; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  .btn:disabled { opacity: 0.45; }
  .demo {
    margin-top: 22px; background: #fff; border-radius: 16px; padding: 14px;
    border: 1px dashed #e0d0bc;
  }
  .demo p { margin: 0 0 8px; font-size: 12px; color: var(--muted); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); background: #fffaf3; border-radius: 999px;
    padding: 7px 10px; font-size: 12px;
  }
  .note { font-size: 12px; color: var(--muted); line-height: 1.45; margin-top: 14px; }
  .top {
    position: sticky; top: 0; z-index: 5;
    background: rgba(247, 241, 231, 0.94); backdrop-filter: blur(10px);
    padding: 14px 16px 10px; border-bottom: 1px solid transparent;
  }
  .top row, .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .who { font-size: 13px; color: var(--muted); }
  .who b { color: var(--ink); }
  .role {
    font-size: 11px; font-weight: 700; border-radius: 999px; padding: 3px 8px; color: white;
  }
  .role.boss { background: var(--boss); }
  .role.staff { background: var(--staff); }
  .role.customer { background: var(--accent); }
  .cats {
    display: flex; gap: 4px; padding: 4px 0 2px;
  }
  .cat {
    flex: 1 1 0; min-width: 0; border: 0; background: white; color: var(--ink); border-radius: 999px;
    padding: 7px 0; font-weight: 700; font-size: 11px; letter-spacing: -0.05em;
    white-space: nowrap; text-align: center;
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .cat.on { background: var(--ink); color: #f6eadc; box-shadow: none; }
  .pad { padding: 8px 16px 110px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card {
    background: var(--card); border-radius: 18px; overflow: hidden;
    box-shadow: 0 8px 20px rgba(70, 42, 18, 0.05);
  }
  .card img, .ph {
    width: 100%; height: 110px; object-fit: cover; display: block; background: #efe2d2;
  }
  .ph { display: grid; place-items: center; color: #8a7562; font-weight: 800; letter-spacing: -0.04em; }
  .card .meta { padding: 10px 12px 12px; }
  .card .meta b { display: block; font-size: 14px; letter-spacing: -0.03em; }
  .card .meta span { color: var(--muted); font-size: 13px; }
  .add {
    margin-top: 8px; width: 100%; border: 0; border-radius: 10px;
    background: #f3e6d6; color: var(--ink); padding: 8px; font-weight: 700;
  }
  .tabs { display: flex; gap: 6px; margin-top: 10px; }
  .tab {
    flex: 1; border: 0; background: transparent; color: var(--muted);
    padding: 8px 4px; font-weight: 700; border-bottom: 2px solid transparent;
  }
  .tab.on { color: var(--ink); border-color: var(--ink); }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .item {
    background: white; border-radius: 16px; padding: 14px;
    box-shadow: 0 8px 20px rgba(70, 42, 18, 0.04);
  }
  .item h3 { margin: 0 0 4px; font-size: 15px; letter-spacing: -0.03em; }
  .item p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px;
    padding: 3px 7px; background: #f4e7d4; color: var(--wait);
  }
  .badge.ok { background: #e5f2e8; color: var(--ok); }
  .badge.no { background: #f8e4df; color: var(--accent); }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .cart {
    position: sticky; bottom: 0; background: var(--ink); color: #f6eadc;
    margin: 0 12px 12px; border-radius: 18px; padding: 14px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .cart button { width: auto; margin: 0; background: #f6eadc; color: var(--ink); }
  .overlay {
    position: fixed; inset: 0; background: rgba(28, 22, 18, 0.46);
    display: none; align-items: flex-end; justify-content: center; z-index: 20;
  }
  .overlay.on { display: flex; }
  .sheet {
    width: min(440px, 100%); background: #fffaf3; border-radius: 22px 22px 0 0;
    padding: 18px 16px 28px; max-height: 86vh; overflow: auto;
  }
  .sync {
    position: fixed; inset: 0; background: #1c1612; color: #f6eadc;
    display: none; place-items: center; z-index: 30; text-align: center; padding: 24px;
  }
  .sync.on { display: grid; }
  .sync b { font-size: 22px; letter-spacing: -0.04em; }
  .sync span { color: #cbbba6; font-size: 14px; }
  .empty { text-align: center; color: var(--muted); padding: 28px 10px; font-size: 14px; }
  .qty { display: flex; align-items: center; gap: 8px; }
  .qty button {
    width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: white;
  }
  .split { display: flex; gap: 8px; }
  .split .btn { margin-top: 0; }
  .photo-row { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  .photo-row img { width: 64px; height: 64px; object-fit: cover; border-radius: 12px; background: #efe2d2; }
  .warn { background: #fff4e8; border-radius: 12px; padding: 10px 12px; font-size: 13px; color: #7a4e16; }
  #mileChip { font-size: 11px; font-weight: 700; color: #8d5a1a; }
  .check { display: flex; align-items: center; gap: 8px; margin: 12px 0; font-size: 14px; }
  .check input { width: auto; }

  .totals { margin-top: 12px; background: white; border-radius: 16px; padding: 12px 14px; }
  .totals div { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; color: #7a6d60; }
  .totals div.sum { color: #1c1612; font-weight: 800; border-top: 1px solid #e4d5c2; margin-top: 4px; padding-top: 10px; }
  .acct { background: #1c1612; color: #f6eadc; border-radius: 16px; padding: 14px; margin: 8px 0 14px; }
  .acct b { display: block; font-size: 20px; letter-spacing: -0.03em; margin-top: 4px; }

  .heart-pop {
    position: fixed; z-index: 80; pointer-events: none; line-height: 1;
    animation: heartFloat .75s ease-out forwards;
  }
  @keyframes heartFloat {
    0% { transform: translate(0, 0) scale(0.3); opacity: 1; }
    100% { transform: translate(var(--dx), -64px) scale(1.15); opacity: 0; }
  }

  .star { border: 0; background: transparent; color: #c4a15a; font-size: 16px; padding: 0 4px 0 0; line-height: 1; }
  .star.on { color: #d39b12; }
  .name-line { display: flex; align-items: center; }
  .pick { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 8px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style id="printCss">
#printArea{display:none}
@media print{html,body{background:#fff!important;padding:0!important;margin:0!important}body>*:not(#printArea){display:none!important}#printArea{display:block!important;color:#111;font-family:'Noto Sans CJK KR',sans-serif}
#printArea table{border-collapse:collapse;width:100%}#printArea td,#printArea th{border:1px solid #999;padding:3px 6px;font-size:12px}#printArea th{background:#eee}#printArea .r{text-align:right}
#printArea .box{display:inline-block;width:13px;height:13px;border:1.5px solid #333;vertical-align:middle}
#printArea .rc{width:72mm;font-family:'Noto Sans Mono CJK KR',monospace;font-size:13px;line-height:1.5}#printArea .rc .ln{display:flex;justify-content:space-between}
#printArea .pb{break-before:page;page-break-before:always}
#printArea .ob{border:1.5px solid #333;margin-bottom:10px;padding:8px;break-inside:avoid}}
</style>
</head>
<body>
<div class="app">
  <section class="screen on" id="auth">
    <div class="auth">
      <div class="mark"><div class="seal">미</div><div><b>미래몰</b><span>테스트 · 이 브라우저에만 저장</span></div></div>
      <h1 id="authTitle">로그인</h1>
      <p class="sub" id="authSub">사장, 직원, 고객이 한 주소에서 권한만 다르게 들어옵니다.</p>
      <div id="loginBox">
        <label>휴대폰 번호</label>
        <input id="loginPhone" inputmode="numeric" placeholder="01012345678" />
        <label>비밀번호</label>
        <input id="loginPw" type="password" placeholder="비밀번호" />
        <button class="btn primary" id="loginBtn">로그인 · 업데이트 확인</button>
        <button class="btn ghost" id="toJoin">고객 회원가입</button>
      </div>
      <div id="joinBox" style="display:none">
        <label>상호 또는 이름</label>
        <input id="joinName" placeholder="예: 홍대점" />
        <label>휴대폰 번호</label>
        <input id="joinPhone" inputmode="numeric" placeholder="01012345678" />
        <label>비밀번호</label>
        <input id="joinPw" type="password" placeholder="4자 이상" />
        <label>사업자번호</label>
        <input id="joinBiz" inputmode="numeric" maxlength="12" placeholder="000-00-00000 또는 10자리" />
        <p class="note">인증번호는 보내지 않습니다. 사업자번호를 넣고 신청하면, 사장 또는 직원이 승인한 뒤에 로그인됩니다.</p>
        <button class="btn primary" id="joinBtn">가입 신청</button>
        <button class="btn ghost" id="toLogin">로그인으로</button>
      </div>
    </div>
  </section>

  <section class="screen" id="main">
    <div class="top">
      <div class="row">
        <div class="who">미래몰 · <b id="userName"></b> <span class="role" id="userRole"></span> <span id="mileChip"></span></div>
        <span><button class="btn line small" id="pwBtn">비밀번호 변경</button> <button class="btn line small" id="logoutBtn">나가기</button></span>
      </div>
      <div class="cats" id="cats"></div>
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="pad" id="body"></div>
  </section>
</div>

<div class="sync" id="sync">
  <div>
    <b>업데이트 확인 중</b><br />
    <span id="syncMsg">최신 메뉴와 승인 내역을 불러오는 중입니다.</span>
  </div>
</div>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>

<script>
const KEY = "baljupan-test-v4";
const ROLE = { boss: "사장", staff: "직원", customer: "고객" };

const seed = () => ({
  version: 1,
  users: [],
  categories: [
    { id: "c-drink", name: "음료", status: "active", order: 1 },
    { id: "c-alc", name: "주류", status: "active", order: 2 },
    { id: "c-etc", name: "그외", status: "active", order: 3 }
  ],
  menus: [
    { id: "m1", categoryId: "c-drink", name: "콜라", price: 2000, mileage: 20, photo: "", status: "active" },
    { id: "m2", categoryId: "c-drink", name: "사이다", price: 2000, mileage: 20, photo: "", status: "active" },
    { id: "m3", categoryId: "c-alc", name: "카스", price: 5000, mileage: 50, photo: "", status: "active" },
    { id: "m4", categoryId: "c-alc", name: "참이슬", price: 5000, mileage: 50, photo: "", status: "active" },
    { id: "m5", categoryId: "c-etc", name: "마른안주", price: 8000, mileage: 80, photo: "", status: "active" }
  ],
  requests: [],
  orders: [],
  posts: [
    { id: "n1", kind: "notice", title: "배송 안내", body: "오후 4시 이전 발주는 다음날 도착합니다.", at: Date.now(), by: "사장" },
    { id: "e1", kind: "event", title: "주류 적립 2배", body: "이번 주 주류 발주는 마일리지가 두 배입니다.", at: Date.now(), by: "사장" }
  ],
  popup: { title: "미래몰 안내", body: "신규 거래처 첫 발주 마일리지를 확인해 주세요." },
  changelog: ["기본 분류 음료, 주류, 그외가 준비되어 있습니다."]
});

let db = load();
let session = null;
let tab = "order";
let cat = "c-drink";
let cart = [];
let pickQty = {};
let usePoints = false;
let lastSyncNotes = [];

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return seed();
    const parsed = JSON.parse(raw);
    if (!parsed.categories || !parsed.users) return seed();
    parsed.posts = parsed.posts || [];
    parsed.popup = parsed.popup || { title: "미래몰 안내", body: "신규 거래처 첫 발주 마일리지를 확인해 주세요." };
    return parsed;
  } catch (e) {
    return seed();
  }
}
function save() { localStorage.setItem(KEY, JSON.stringify(db)); cloudPush(); }
function uid(p) { return p + Math.random().toString(36).slice(2, 8); }
function won(n) { return Number(n || 0).toLocaleString("ko-KR") + "원"; }
function pt(n) { return Number(n || 0).toLocaleString("ko-KR") + "P"; }
function mileOf(m) { return Number(m && m.mileage) || 0; }
function phone(v) { return String(v || "").replace(/\D/g, ""); }
function fmtPhone(p) { p = phone(p); return p.length === 11 ? p.slice(0,3) + "-" + p.slice(3,7) + "-" + p.slice(7) : p.length === 10 ? p.slice(0,3) + "-" + p.slice(3,6) + "-" + p.slice(6) : p; }
function showPhone(p) { p = phone(p); if (session && session.role === "staff") return p.slice(0,3) + "-****-" + p.slice(-4); return fmtPhone(p); }
function userBizNo(u) { return phone((u && (u.bizNo || (u.taxInfo && u.taxInfo.bizNo))) || ""); }
function fmtBizNo(b) { b = phone(b); return b.length === 10 ? b.slice(0,3) + "-" + b.slice(3,5) + "-" + b.slice(5) : b; }
function validBizNo(v) {
  const d = phone(v);
  if (d.length !== 10) return false;
  const w = [1, 3, 7, 1, 3, 7, 1, 3, 5];
  let sum = 0;
  for (let i = 0; i < 9; i++) sum += Number(d[i]) * w[i];
  sum += Math.floor(Number(d[8]) * 5 / 10);
  return (10 - (sum % 10)) % 10 === Number(d[9]);
}
function isLockedUser(u) {
  if (!u) return false;
  if (u.locked === true || u.locked === "true") return true;
  const until = Number(u.lockUntil);
  return u.role === "boss" && until && until > Date.now();
}
function canUnlock(u) {
  if (!u || !session) return false;
  if (session.role === "boss") return u.role !== "boss";
  return session.role === "staff" && u.role === "customer";
}
function joinUserHtml(u) {
  const biz = userBizNo(u);
  return `<article class="item"><h3>${esc(u.name)}</h3><p>${esc(showPhone(u.phone))}${biz ? " · 사업자 " + esc(fmtBizNo(biz)) : ""}</p>
      <div class="actions"><button class="btn accent small" data-ok="${u.id}">승인</button><button class="btn line small" data-no="${u.id}">거절</button></div></article>`;
}
function lockedUsers() {
  return db.users.filter(u => u.id !== session.id && isLockedUser(u) && u.role !== "boss");
}
function lockedSectionHtml() {
  const list = lockedUsers();
  const cards = list.length ? `<div class="list">${list.map(u => {
    const biz = userBizNo(u);
    const whenAt = u.lockedAt ? when(Number(u.lockedAt)) : "";
    return `<article class="item"><h3>${esc(u.name)} <span class="badge">잠김</span></h3>
      <p>${esc(ROLE[u.role] || u.role)} · ${esc(showPhone(u.phone))}${biz ? " · 사업자 " + esc(fmtBizNo(biz)) : ""}${whenAt ? " · " + esc(whenAt) : ""}</p>
      <p class="note">비밀번호를 5회 틀려 잠겼습니다.</p>
      ${canUnlock(u) ? `<div class="actions"><button class="btn accent small" data-ul="${u.id}">잠금 해제</button></div>` : `<p class="note">직원 계정은 사장님만 잠금 해제할 수 있습니다.</p>`}
    </article>`;
  }).join("")}</div>` : `<div class="empty">잠긴 계정이 없습니다.</div>`;
  return `<h3 style="margin:16px 0 8px;font-size:15px">잠긴 계정</h3>
    <p class="note" style="margin-top:0">비밀번호 5회 오류 시 잠깁니다. 고객은 사장·직원이, 직원은 사장만 해제할 수 있습니다.</p>
    ${cards}`;
}
function bindUnlockActions() {
  document.querySelectorAll("[data-ul]").forEach(b => b.onclick = () => unlockUser(b.dataset.ul));
}
async function unlockUser(id) {
  if (!cloud.ok) {
    const u = db.users.find(x => x.id === id);
    if (!u || !canUnlock(u)) return alert("이 계정은 사장님만 잠금 해제할 수 있습니다.");
    u.locked = false; u.failCount = 0; delete u.lockedAt; delete u.lockUntil;
    save(); render(); return;
  }
  const r = await cloud.sb.rpc("mm_unlock", { p_token: cloudToken(), p_user: id });
  if (r.error) return alert("잠금 해제를 아직 할 수 없습니다. 서버 업데이트가 끝나면 다시 시도해 주세요.");
  if (r.data && r.data.error === "forbidden") return alert("이 계정은 사장님만 잠금 해제할 수 있습니다.");
  if (r.data && r.data.error === "none") return alert("계정을 찾지 못했습니다.");
  if (!r.data || !r.data.ok) return alert("잠금 해제에 실패했습니다.");
  const u = db.users.find(x => x.id === id);
  if (u) { u.locked = false; u.failCount = 0; delete u.lockedAt; delete u.lockUntil; }
  render();
}
function loginFailAlert(r) {
  if (r && r.error === "locked") {
    if (r.until) {
      const d = new Date(Number(r.until));
      const t = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
      return alert("비밀번호를 5회 틀려 15분간 로그인이 잠겼습니다. " + t + " (한국시간) 이후에 다시 시도해 주세요.");
    }
    return alert("비밀번호를 5회 틀려 계정이 잠겼습니다. 사장 또는 직원에게 잠금 해제를 요청해 주세요.");
  }
  if (r && r.remain != null) return alert("번호 또는 비밀번호가 맞지 않습니다. " + r.remain + "회 더 틀리면 계정이 잠깁니다.");
  return alert("번호 또는 비밀번호가 맞지 않습니다.");
}
function localLogin(p, pw) {
  const u = db.users.find(x => x.phone === p);
  if (!u) return { error: "bad" };
  if (u.role === "boss" && u.lockUntil && Number(u.lockUntil) > Date.now()) return { error: "locked", remain: 0, until: Number(u.lockUntil) };
  if (u.locked === true || u.locked === "true") return { error: "locked", remain: 0 };
  if (u.pw !== pw) {
    u.failCount = (Number(u.failCount) || 0) + 1;
    if (u.failCount >= 5) {
      if (u.role === "boss") {
        u.failCount = 0;
        u.lockUntil = Date.now() + 15 * 60 * 1000;
        save();
        return { error: "locked", remain: 0, until: u.lockUntil };
      }
      u.failCount = 0;
      u.locked = true;
      u.lockedAt = Date.now();
      save();
      return { error: "locked", remain: 0 };
    }
    save();
    return { error: "bad", remain: 5 - u.failCount };
  }
  u.failCount = 0;
  u.locked = false;
  delete u.lockUntil;
  delete u.lockedAt;
  if (u.status !== "active") { save(); return { error: u.status || "bad" }; }
  save();
  return { user: u };
}

/* ===== 주류 보증금·회수상품 ===== */
let cartReturn = {}; // menuId -> {bottles, boxes}
let depData = null;
function isLiquor(m) {
  if (!m) return false;
  const cat = (db.categories.find(c => c.id === m.categoryId) || {}).name;
  return cat === "주류" || Number(m.bottlesPerBox) > 0 || Number(m.bottleDep) > 0 || Number(m.boxDep) > 0;
}
function bppOf(m) { return Math.max(0, parseInt(m && m.bottlesPerBox, 10) || 0); }
function bottleDepOf(m) { return Math.max(0, Number(m && m.bottleDep) || 0); }
function boxDepOf(m) { return Math.max(0, Number(m && m.boxDep) || 0); }
function itemDeposit(m, qty) { return qty * bppOf(m) * bottleDepOf(m) + qty * boxDepOf(m); }
function cartDepositAmt() {
  return cart.reduce((s, i) => { const m = db.menus.find(x => x.id === i.id); return s + (isLiquor(m) ? itemDeposit(m, i.qty) : 0); }, 0);
}
function myOutstanding() {
  const list = (depData && depData.balances) || [];
  return session.role === "customer" ? list.filter(b => !b.userId || b.userId === session.id) : list;
}
function outstandingOf(menuId) {
  const m = db.menus.find(x => x.id === menuId);
  const b = myOutstanding().find(x => x.menuId === menuId);
  return b || { bottles: 0, boxes: 0, bottleDep: bottleDepOf(m), boxDep: boxDepOf(m), amount: 0 };
}
function returnLines() {
  return Object.entries(cartReturn).map(([menuId, v]) => {
    const m = db.menus.find(x => x.id === menuId); if (!m) return null;
    const bottles = Math.max(0, parseInt(v.bottles, 10) || 0), boxes = Math.max(0, parseInt(v.boxes, 10) || 0);
    if (!bottles && !boxes) return null;
    const bottleDep = bottleDepOf(m), boxDep = boxDepOf(m);
    return { menuId, name: m.name, bottles, boxes, bottleDep, boxDep, amount: bottles * bottleDep + boxes * boxDep };
  }).filter(Boolean);
}
function returnTotalAmt() { return returnLines().reduce((s, r) => s + r.amount, 0); }

let printDate = "";
const printPick = new Set();
function ymd(t) { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function hm(t) { const d = new Date(t); return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); }
function orderNo(o) { const day = ymd(o.at); const same = db.orders.filter(x => ymd(x.at) === day).sort((a,b) => a.at - b.at); return day.replace(/-/g,"") + "-" + String(same.indexOf(o) + 1).padStart(3,"0"); }
function n0(n) { return Number(n || 0).toLocaleString("ko-KR"); }
function printSet() {

        <p class="note">이 화면을 닫으면 다시 볼 수 없습니다. 회원에게 따로 알려 주세요.</p><button class="btn primary" id="tmpOk">확인</button>`);
      document.getElementById("tmpOk").onclick = closeSheet;
    };
}
function approve(id) {
  const r = db.requests.find(x => x.id === id);
  if (r.type === "category") {
    db.categories.push({ id: uid("c"), name: r.name, status: "active", order: db.categories.length + 1 });
    bump("분류 '" + r.name + "'가 승인되어 반영되었습니다.");
  } else if (r.type === "menu") {
    db.menus.push({ id: uid("m"), categoryId: r.categoryId, name: r.name, price: r.price, mileage: Number(r.mileage) || 0, photo: r.photo || "", status: "active" });
    bump("메뉴 '" + r.name + "'가 승인되어 반영되었습니다.");
  } else if (r.type === "mileage") {
    const m = db.menus.find(x => x.id === r.menuId);
    if (m) { m.mileage = Number(r.mileage) || 0; bump(m.name + " 마일리지 " + pt(m.mileage) + "가 승인되었습니다."); }
    else save();
  } else if (r.type === "photo") {
    const m = db.menus.find(x => x.id === r.menuId);
    if (m) { m.photo = r.photo; bump(m.name + " 사진이 승인되어 바뀌었습니다."); }
    else save();
  }
  r.status = "approved";
  save(); render();
}
function bump(text) {
  db.version += 1;
  db.changelog.push(text);
  save();
}
function compress(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, 640 / img.width);
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL("image/jpeg", 0.72));
    };
    img.onerror = reject;
    img.src = url;
  });
}

/* ===== 기간별 입출고 조회 (KST, 클라이언트 계산) =====
   입고·조정: 승인된 건만, 날짜는 등록일(at). 출고: '완료' 주문, 완료시각(doneAt) 있으면 그것, 없으면 주문일. */
const kstFmt = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit" });
function kstDay(t) { return kstFmt.format(new Date(t)); }
let spMode = "month", spFrom = "", spTo = "", spView = "item", spCache = { key: "", moves: null };
// 서버 기간조회(mm_stock_period) 우선, 없으면(옛 서버) mm_stock_list 내역으로 대체
function spLoad(a, b) {
  const key = a + "~" + b;
  if (spCache.key === key) return;
  spCache = { key, moves: null };
  stockRpc("mm_stock_period", { p_from: a, p_to: b }).then(m => { spCache = { key, moves: Array.isArray(m) ? m : null }; })
    .catch(() => { spCache = { key, moves: null, fallback: true }; })
    .then(() => { if (tab === "stock" && spCache.key === key) renderStock(); });
}
function spRange() {
  const today = kstDay(Date.now());
  if (!spFrom) { spFrom = spMode === "month" ? today.slice(0, 7) : today.slice(0, 8) + "01"; spTo = spMode === "month" ? today.slice(0, 7) : today; }
  if (spMode === "month") { const [y, m] = spTo.split("-").map(Number); const last = new Date(Date.UTC(y, m, 0)).getUTCDate(); return [spFrom + "-01", spTo + "-" + String(last).padStart(2, "0")]; }
  return [spFrom, spTo];
}
function stockEvents() {
  const ev = [];
  (spCache.moves || (stockData && stockData.moves) || []).filter(x => x.status === "approved").forEach(x => ev.push({ day: kstDay(x.at), menuId: x.menu_id, kind: x.kind === "in" ? "in" : "adj", qty: Number(x.qty) || 0 }));
  db.orders.filter(o => o.status === "완료").forEach(o => (o.items || []).forEach(i => {
    const mid = i.menuId || (db.menus.find(m => m.name === i.name) || {}).id; if (!mid) return;
    ev.push({ day: kstDay(o.doneAt || o.at), menuId: mid, kind: "out", qty: Number(i.qty) || 0 });
  }));
  return ev;
}
function stockPeriodHtml(menus) {

  const sum = (list, k) => list.filter(e => e.kind === k).reduce((s, e) => s + e.qty, 0);
  const sg = n => (n > 0 ? "+" : "") + n0(n);

  let table;

    const ids = menus.map(m => m.id).concat([...new Set(ev.map(e => e.menuId))].filter(id => !menus.some(m => m.id === id)));
    const rows = ids.map(id => { const l = ev.filter(e => e.menuId === id); return { id, i: sum(l, "in"), o: sum(l, "out"), d: sum(l, "adj") }; });
    table = `<tr><th style="text-align:left">품목</th><th ${td}>입고</th><th ${td}>출고</th><th ${td}>조정</th></tr>` +

  } else {

    table = `<tr><th style="text-align:left">날짜</th><th style="text-align:left">품목</th><th ${td}>입고</th><th ${td}>출고</th><th ${td}>조정</th></tr>` +

        return `<tr><td>${d.slice(5)}</td><td>${esc(menuName(id))}</td><td ${td}>${sum(l, "in") ? n0(sum(l, "in")) : ""}</td><td ${td}>${sum(l, "out") ? n0(sum(l, "out")) : ""}</td><td ${td}>${sum(l, "adj") ? sg(sum(l, "adj")) : ""}</td></tr>`; }).join("") : `<tr><td colspan="5">기간 내 내역 없음</td></tr>`) +
      `<tr style="font-weight:700;border-top:2px solid #333"><td colspan="2">합계</td><td ${td}>${n0(sum(ev, "in"))}</td><td ${td}>${n0(sum(ev, "out"))}</td><td ${td}>${sg(sum(ev, "adj"))}</td></tr>`;

      <button class="btn ${spView === "item" ? "" : "line"} small" data-spv="item">품목별</button><button class="btn ${spView === "day" ? "" : "line"} small" data-spv="day">일자별</button></div>

    <p class="note">${a} ~ ${b} (한국시간) · 입고·조정은 승인된 건, 등록일 기준 · 출고는 '완료' 주문, 완료일 기준(완료일 없는 예전 주문은 주문일)${spCache.moves ? "" : spCache.fallback ? " · 최근 내역 기준" : " · 불러오는 중"}</p>
    <table id="spTable" style="width:100%;border-collapse:collapse;font-size:14px">${table}</table></article>`;

function dep2LedgerRows(r) {
  const balances=new Map(), days=new Map(), out=[];
  const key=(z)=>JSON.stringify([z.user_id,z.menu_id]);
  const ensure=z=>{const k=key(z); if(!balances.has(k)) balances.set(k,{user_id:z.user_id,menu_id:z.menu_id,user_name:z.user_name,menu_name:z.menu_name,bottles:0,boxes:0,amount:0}); return balances.get(k);};
  (r.opening||[]).forEach(z=>{const b=ensure(z); b.bottles+=Number(z.bottles); b.boxes+=Number(z.boxes); b.amount+=Number(z.amount);});
  balances.forEach(b=>out.push(Object.assign({day:r.from,kind:'opening',ob:0,ox:0,ib:0,ix:0,sb:0,sx:0},b)));
  (r.entries||[]).forEach(z=>{
    const k=JSON.stringify([z.day,z.user_id,z.menu_id]);
    if(!days.has(k)) days.set(k,{day:z.day,user_id:z.user_id,menu_id:z.menu_id,user_name:z.user_name,menu_name:z.menu_name,kind:'daily',ob:0,ox:0,ib:0,ix:0,sb:0,sx:0,delta:0});
    const d=days.get(k), prefix=z.kind==='out'?'o':z.kind==='in'?'i':'s';
    d[prefix+'b']+=Number(z.bottles); d[prefix+'x']+=Number(z.boxes); d.delta+=(z.kind==='out'?1:-1)*Number(z.amount);
  });
  Array.from(days.values()).sort((a,b)=>a.day.localeCompare(b.day)||a.user_name.localeCompare(b.user_name)||a.menu_name.localeCompare(b.menu_name)).forEach(d=>{
    const b=ensure(d); b.bottles+=d.ob-d.ib-d.sb; b.boxes+=d.ox-d.ix-d.sx; b.amount+=d.delta;
    out.push(Object.assign({},d,{bottles:b.bottles,boxes:b.boxes,amount:b.amount}));
  });
  balances.forEach(b=>out.push(Object.assign({day:r.to,kind:'closing',ob:0,ox:0,ib:0,ix:0,sb:0,sx:0},b)));
  return out;
}

function dep2CsvText(r) {

function dep2AskSettlement() {

  let uid=dep2.user || ((dep2.report.accounts||[])[0]||{}).user_id || ((dep2Customers()[0])||{}).id || '';
  const request=crypto.randomUUID();
  const show=()=>{
    const bal=((depData||{}).balances||[]).filter(z=>z.userId===uid && (z.bottles>0||z.boxes>0));
    openSheet(`<h2>변상 정산 · 사장 전용</h2><p>과세 매출 · 입력 금액은 부가세 포함 공급대가입니다.<br>증빙: ${esc(evLabel(userEvidence(uid)))}</p><label>업소</label><select id="dsUser">${dep2Options(uid,false)}</select>
      ${bal.map((z,i)=>`<label>${esc(z.menuName)} · 미회수 병 ${n0(z.bottles)} / 박스 ${n0(z.boxes)}</label><div class="row" style="gap:6px"><input id="dsB${i}" type="number" min="0" max="${z.bottles}" step="1" placeholder="변상 병 수"><input id="dsX${i}" type="number" min="0" max="${z.boxes}" step="1" placeholder="변상 박스 수"></div>`).join('')||'<p>미회수 잔량 없음</p>'}
      <button class="btn small" id="dsAll">미회수 수량 전체 선택</button><label>변상금액 (원, 부가세 포함)</label><input id="dsAmt" type="number" min="0" step="0.01" placeholder="합의한 변상금액(부가세 포함) 입력"><p id="dsTax" class="note">공급가액 0원 · 부가세 0원</p><label>정산 사유 (필수)</label><input id="dsMemo" maxlength="500" placeholder="예: 분실로 업소와 변상 합의"><button class="btn primary" id="dsSave" ${bal.length?'':'disabled'}>확인 후 정산 저장·80mm 정산서</button>`);
    document.getElementById('dsUser').onchange=e=>{uid=e.target.value; show();};
    document.getElementById('dsAmt').oninput=e=>{const t=settleTax({amount:Number(e.target.value)||0});document.getElementById('dsTax').textContent='공급가액 '+won(t.supply)+' · 부가세 '+won(t.vat);};
    document.getElementById('dsAll').onclick=()=>bal.forEach((z,i)=>{document.getElementById('dsB'+i).value=z.bottles;document.getElementById('dsX'+i).value=z.boxes;});
    document.getElementById('dsSave').onclick=async()=>{
      if(dep2.saving) return;
      const items=[];
      for(let i=0;i<bal.length;i++) {
        const b=Number(document.getElementById('dsB'+i).value||0), x=Number(document.getElementById('dsX'+i).value||0);
        if(!Number.isInteger(b)||!Number.isInteger(x)||b<0||x<0||b>Number(bal[i].bottles)||x>Number(bal[i].boxes)) return alert('미회수 잔량 이내의 정수 수량을 입력해 주세요.');
        if(b||x) items.push({menuId:bal[i].menuId,bottles:b,boxes:x});
      }
      const field=document.getElementById('dsAmt'), amount=Number(field.value), memo=document.getElementById('dsMemo').value.trim();
      if(!items.length) return alert('변상 수량을 입력해 주세요.');
      if(field.value===''||!Number.isFinite(amount)||amount<0||Math.abs(Math.round(amount*100)-amount*100)>0.00001) return alert('변상금액을 정확히 입력해 주세요.');
      if(!memo) return alert('사유를 입력해 주세요.');
      const u=db.users.find(z=>z.id===uid)||{};
      if(!confirm(`${u.name||uid}\n${items.map(z=>menuName(z.menuId)+' 병 '+z.bottles+' / 박스 '+z.boxes).join('\n')}\n변상금액 ${won(amount)} (공급가액 ${won(settleTax({amount}).supply)} · 부가세 ${won(settleTax({amount}).vat)})\n이 수량은 회수가 아닌 변상으로 잔량에서 빠집니다. 확정할까요?`)) return;
      dep2.saving=true; const btn=document.getElementById('dsSave'); btn.disabled=true;
      try {
        const s=await dep2Rpc('mm_deposit_settle',{p_user:uid,p_items:items,p_amount:amount,p_memo:memo,p_request:request});
        closeSheet(); dep2.loaded=false; dep2.daily=null; depData=null; doPrint(dep2Settlement80(s),'80mm auto'); render();
      } catch(e) { alert('정산 실패: '+dep2Error(e)); btn.disabled=false; }
      finally {dep2.saving=false;}
    };
  }; show();
}
function dep2Bind() {
  const $=id=>document.getElementById(id);
  $('d2User').onchange=e=>{dep2.user=e.target.value;};
  $('d2Mode').onchange=e=>{dep2.mode=e.target.value; renderDeposit();};
  const storePeriod=()=>{ if(dep2.mode==='month'){dep2.monthFrom=$('d2From').value;dep2.monthTo=$('d2To').value;}else{dep2.from=$('d2From').value;dep2.to=$('d2To').value;} };
  $('d2From').onchange=$('d2To').onchange=storePeriod;
  $('d2Query').onclick=()=>{
    storePeriod();
    if(dep2.mode==='month') {
      if(!/^\d{4}-\d{2}$/.test(dep2.monthFrom)||!/^\d{4}-\d{2}$/.test(dep2.monthTo)) return alert('시작 월과 끝 월을 입력해 주세요.');
      dep2.from=dep2.monthFrom+'-01';
      const [y,m]=dep2.monthTo.split('-').map(Number); dep2.to=dep2.monthTo+'-'+new Date(Date.UTC(y,m,0)).getUTCDate();
    }
    if(!dep2.from||!dep2.to||dep2.from>dep2.to) return alert('시작일과 종료일을 확인해 주세요.');
    // Refresh both current balances and the requested ledger (also retries after SQL is applied).
    dep2.loaded=false; depData=null; renderDeposit();
  };
  $('d2P80').onclick=()=>dep2PrintLedger(true); $('d2PA4').onclick=()=>dep2PrintLedger(false);
  if($('d2DaysSave')) $('d2DaysSave').onclick=async()=>{
    const days=Number($('d2Days').value); if(!Number.isInteger(days)||days<1||days>36500) return alert('1~36500일을 입력해 주세요.');
    try {await dep2Rpc('mm_deposit_config',{p_days:days});await dep2Load();}catch(e){alert(dep2Error(e));}
  };
  if($('d2Settle')) $('d2Settle').onclick=dep2AskSettlement;
  document.querySelectorAll('[data-d2-setprint]').forEach(b=>b.onclick=()=>doPrint(dep2Settlement80(dep2.report.settlements[Number(b.dataset.d2Setprint)]),'80mm auto'));
  $('d2Day').onchange=e=>{dep2.day=e.target.value;dep2.daily=null; ['d2Csv','d2DailyPrint','d2Daily80'].forEach(id=>$(id).disabled=true);};
  $('d2Daily').onclick=async()=>{
    const day=$('d2Day').value; if(!day) return alert('날짜를 선택해 주세요.'); $('d2Daily').disabled=true;
    try {dep2.daily=await dep2Rpc('mm_deposit_report',{p_from:day,p_to:day,p_user:null});dep2.day=day;renderDeposit();}
    catch(e) {alert(dep2Missing(e)?'서버 확장 설정 적용 대기 중입니다.':dep2Error(e));$('d2Daily').disabled=false;}
  };
  $('d2Csv').onclick=dep2Download;
  $('d2DailyPrint').onclick=()=>{if(dep2.daily)doPrint(dep2DailyHtml(dep2.daily,false),'A4');};
  $('d2Daily80').onclick=()=>{if(dep2.daily)doPrint('<div class="rc">'+dep2DailyHtml(dep2.daily,true)+'</div>','80mm auto');};
  if(!dep2.loaded&&!dep2.busy) dep2Load();
}

/* ===== 매입·매출 (사장 전용) =====
   공병·공박스 보증금·회수 환급: 비과세, 공급가액 제외 (부가세법 시행령 제61조제2항, 부가기본통칙 13-48-5 ①)
   미회수 변상금: 과세 매출 (통칙 13-48-5 ②), 부가세 포함 공급대가 → 공급가액 = round(금액×10/11) */
function settleTax(s) {
  const amount = Number(s && s.amount) || 0;
  if (s && s.supply != null && s.vat != null) return { amount, supply: Number(s.supply) || 0, vat: Number(s.vat) || 0 };
  const supply = Math.round(amount * 10 / 11);
  return { amount, supply, vat: Math.round((amount - supply) * 100) / 100 };
}
function userEvidence(uid) {
  const last = db.orders.filter(o => o.userId === uid && o.evidence && (o.evidence.type === "cash" || o.evidence.type === "tax"))
    .sort((a, b) => (Number(b.at) || 0) - (Number(a.at) || 0))[0];
  if (last) return last.evidence;
  const biz = userBizNo(db.users.find(x => x.id === uid));
  return biz.length === 10 ? { type: "tax", bizNo: biz, source: "signup" } : { type: "none" };
}
function settleEvidence(s) { return s && s.evidence && s.evidence.type ? s.evidence : userEvidence(s && s.userId); }
function evLabel(e) { return e && e.type && e.type !== "none" ? evText(e) : "미정 (업소와 확인 필요)"; }
function settleTaxLine(s) { const t = settleTax(s); return `과세 매출 · 공급가액 ${won(t.supply)} · 부가세 ${won(t.vat)} · 증빙 ${esc(evLabel(settleEvidence(s)))}`; }

const vl = { mode: "quarter", qYear: 0, q: 1, monthFrom: "", monthTo: "", from: "", to: "", report: null, busy: false, error: "", missing: false, key: "" };
const VL_NUM = ["orders", "supply", "vat", "outB", "outBAmt", "outX", "outXAmt", "inB", "inBAmt", "inX", "inXAmt", "setB", "setX", "setCount", "setAmt", "setSupply", "setVat", "balB", "balX", "balAmt"];
function vlInit() {
  const today = kstDay(Date.now());
  if (!vl.from) {
    vl.qYear = Number(today.slice(0, 4)); vl.q = Math.floor((Number(today.slice(5, 7)) - 1) / 3) + 1;
    vl.monthFrom = vl.monthTo = today.slice(0, 7);
    vlSetQuarter(vl.qYear, vl.q);
  }
}
// 법인 부가세 분기 신고: 1~3, 4~6, 7~9, 10~12월
function vlSetQuarter(y, q) {
  const m1 = (q - 1) * 3 + 1, m3 = m1 + 2, last = new Date(Date.UTC(y, m3, 0)).getUTCDate();
  vl.qYear = y; vl.q = q; vl.from = y + "-" + String(m1).padStart(2, "0") + "-01"; vl.to = y + "-" + String(m3).padStart(2, "0") + "-" + String(last).padStart(2, "0");
}
function vlCompute(r, from, to) {
  const U = new Map();
  const get = (id, name) => {
    if (!U.has(id)) {
      const u = db.users.find(x => x.id === id) || {};
      const a = { userId: id, name: name || u.name || id, bizNo: userBizNo(u), ev: { cash: 0, tax: 0, none: 0 }, setEv: null };
      VL_NUM.forEach(k => a[k] = 0); U.set(id, a);
    }
    return U.get(id);
  };
  db.orders.filter(o => o.status === "완료").forEach(o => {
    const d = kstDay(o.doneAt || o.at); if (d < from || d > to) return;
    const a = get(o.userId, o.name); a.orders++; a.supply += Number(o.supply) || 0; a.vat += Number(o.vat) || 0;
    const t = (o.evidence && o.evidence.type) || "none"; a.ev[a.ev[t] != null ? t : "none"]++;
  });
  if (r) {
    (r.opening || []).forEach(z => { const a = get(z.user_id, z.user_name); a.balB += Number(z.bottles) || 0; a.balX += Number(z.boxes) || 0; a.balAmt += Number(z.amount) || 0; });
    (r.entries || []).forEach(z => {
      const a = get(z.user_id, z.user_name), b = Number(z.bottles) || 0, x = Number(z.boxes) || 0;
      const bd = Number(z.bottle_dep) || 0, xd = Number(z.box_dep) || 0, amt = Number(z.amount) || 0;
      if (z.kind === "out") { a.outB += b; a.outBAmt += b * bd; a.outX += x; a.outXAmt += x * xd; a.balB += b; a.balX += x; a.balAmt += amt; }
      else if (z.kind === "in") { a.inB += b; a.inBAmt += b * bd; a.inX += x; a.inXAmt += x * xd; a.balB -= b; a.balX -= x; a.balAmt -= amt; }
      else if (z.kind === "settle") { a.setB += b; a.setX += x; a.balB -= b; a.balX -= x; a.balAmt -= amt; }
    });
    (r.settlements || []).forEach(s => { const a = get(s.userId, s.userName), t = settleTax(s); a.setCount++; a.setAmt += t.amount; a.setSupply += t.supply; a.setVat += t.vat; a.setEv = settleEvidence(s); });
  }
  const rows = Array.from(U.values()).filter(a => VL_NUM.some(k => a[k])).sort((a, b) => String(a.name).localeCompare(String(b.name)));
  const total = { name: "합계", bizNo: "", ev: { cash: 0, tax: 0, none: 0 } };
  VL_NUM.forEach(k => total[k] = rows.reduce((s, a) => s + a[k], 0));
  rows.forEach(a => ["cash", "tax", "none"].forEach(k => total.ev[k] += a.ev[k]));
  return { rows, total };
}
function vlEvText(a) {
  const p = [];
  if (a.ev.tax) p.push("세금계산서 " + a.ev.tax + "건"); if (a.ev.cash) p.push("현금영수증 " + a.ev.cash + "건"); if (a.ev.none) p.push("필요없음 " + a.ev.none + "건");
  if (a.setEv) p.push("변상: " + evLabel(a.setEv));
  return p.join(" · ") || "-";
}
const VL_HEAD = ["업소", "사업자번호", "주문 과세 공급가액", "주문 부가세", "공병 출고(병)", "공병 출고액(비과세)", "공박스 출고(박스)", "공박스 출고액(비과세)",
  "공병 회수(병)", "공병 환급액(비과세)", "공박스 회수(박스)", "공박스 환급액(비과세)", "변상 과세 공급가액", "변상 부가세", "변상 합계", "과세매출 공급가액 합계", "부가세 합계",
  "미회수 공병(병)", "미회수 공박스(박스)", "미회수 보증금 잔액", "증빙"];
function vlRow(a) {
  return [a.name, a.bizNo ? fmtBizNo(a.bizNo) : "", a.supply, a.vat, a.outB, a.outBAmt, a.outX, a.outXAmt, a.inB, a.inBAmt, a.inX, a.inXAmt,
    a.setSupply, a.setVat, a.setAmt, a.supply + a.setSupply, a.vat + a.setVat, a.balB, a.balX, a.balAmt, vlEvText(a)];
}
function vlTableHtml(c) {
  const money = new Set([2, 3, 5, 7, 9, 11, 12, 13, 14, 15, 16, 19]);
  const cell = (v, i) => typeof v === "number" ? (money.has(i) ? won(v) : n0(v)) : esc(v);
  return `<div style="overflow-x:auto"><table style="width:100%;min-width:1100px;border-collapse:collapse;font-size:11px"><thead><tr>${VL_HEAD.map(x => `<th style="padding:4px;border-bottom:1px solid #999;text-align:left">${x}</th>`).join("")}</tr></thead><tbody>
    ${c.rows.concat([c.total]).map((a, ri) => `<tr style="${ri === c.rows.length ? "font-weight:700;background:#f4f4f4" : ""}">${vlRow(a).map((v, i) => `<td style="padding:4px;border-bottom:1px solid #ddd;${typeof v === "number" ? "text-align:right" : ""}">${cell(v, i)}</td>`).join("")}</tr>`).join("")}
  </tbody></table></div>`;
}
function vlSummaryHtml(c) {
  const t = c.total;
  return `<div class="totals">
    <div><span>과세 매출 공급가액 (주문 ${won(t.supply)} + 변상 ${won(t.setSupply)})</span><b>${won(t.supply + t.setSupply)}</b></div>
    <div><span>부가세 (주문 ${won(t.vat)} + 변상 ${won(t.setVat)})</span><b>${won(t.vat + t.setVat)}</b></div>
    <div><span>공병 출고 ${n0(t.outB)}병 · 공박스 ${n0(t.outX)}박스 (비과세)</span><b>${won(t.outBAmt + t.outXAmt)}</b></div>
    <div><span>공병 회수 ${n0(t.inB)}병 · 공박스 ${n0(t.inX)}박스 환급 (비과세)</span><b>-${won(t.inBAmt + t.inXAmt)}</b></div>
    <div><span>변상 처리 공병 ${n0(t.setB)}병 · 공박스 ${n0(t.setX)}박스 (${n0(t.setCount)}건)</span><b>${won(t.setAmt)}</b></div>
    <div class="sum"><span>기말 미회수 보증금 (공병 ${n0(t.balB)} · 공박스 ${n0(t.balX)})</span><b>${won(t.balAmt)}</b></div></div>`;
}
const VL_LAW = "공병·공박스 보증금과 회수 환급은 반환조건부 용기대금으로 공급가액에서 제외되며 부가세가 없습니다(부가가치세법 시행령 제61조제2항, 부가기본통칙 13-48-5 ①). 미회수로 받은 변상금은 과세 공급이며(통칙 13-48-5 ②), 변상금액을 부가세 포함 공급대가로 보아 공급가액 = 금액×10/11, 부가세 = 금액 − 공급가액으로 계산합니다. 주문 매출은 '완료' 주문, 완료일 기준(한국시간)입니다.";
function vlLoad() {
  const key = vl.from + "~" + vl.to;
  if (vl.busy || vl.key === key) return;
  vl.busy = true; vl.error = ""; vl.key = key;
  dep2Rpc("mm_deposit_report", { p_from: vl.from, p_to: vl.to, p_user: null })
    .then(r => { vl.report = r; vl.missing = false; })
    .catch(e => { vl.report = null; vl.missing = dep2Missing(e); vl.error = vl.missing ? "" : dep2Error(e); })
    .finally(() => { vl.busy = false; if (tab === "vat") renderVatLedger(); });
}
function renderVatLedger() {
  if (!session || session.role !== "boss") { document.getElementById("body").innerHTML = `<div class="empty">사장만 볼 수 있습니다.</div>`; return; }
  vlInit(); vlLoad();
  const c = vlCompute(vl.report, vl.from, vl.to);
  const ready = !!vl.report;
  document.getElementById("body").innerHTML = `<article class="item"><h3>매입·매출 (공병·공박스 포함)</h3>
    <p class="note" style="margin-top:0">${VL_LAW}</p>
    <p class="note">법인은 부가세를 분기별로 신고합니다. 분기를 고르면 바로 조회됩니다.</p>
    <div class="row" style="gap:6px;flex-wrap:wrap"><input type="number" id="vlQYear" min="2020" max="2100" value="${vl.qYear}" style="width:90px;margin:0">${[1, 2, 3, 4].map(q => `<button class="btn small ${vl.mode === "quarter" && vl.q === q ? "primary" : "line"}" data-vlq="${q}">${q}기 ${(q - 1) * 3 + 1}~${q * 3}월</button>`).join("")}</div>
    <label>기간 입력</label><select id="vlMode"><option value="quarter" ${vl.mode === "quarter" ? "selected" : ""}>분기</option><option value="month" ${vl.mode === "month" ? "selected" : ""}>월별 범위</option><option value="date" ${vl.mode === "date" ? "selected" : ""}>날짜 직접 입력</option></select>
    <div class="row" style="gap:6px">${vl.mode === "quarter" ? `<span>${vl.qYear}년 ${vl.q}분기 (${esc(vl.from)} ~ ${esc(vl.to)})</span>` : vl.mode === "month" ? `<input type="month" id="vlFrom" value="${vl.monthFrom}"><span>~</span><input type="month" id="vlTo" value="${vl.monthTo}">` : `<input type="date" id="vlFrom" value="${vl.from}"><span>~</span><input type="date" id="vlTo" value="${vl.to}">`}</div>
    <div class="actions" style="flex-wrap:wrap"><button class="btn primary small" id="vlQuery">${vl.busy ? "조회 중…" : "기간 조회"}</button><button class="btn small" id="vlCsv">CSV(엑셀) 내려받기</button><button class="btn small" id="vlPrint">A4 출력</button></div>
    ${vl.missing ? `<p style="color:#b45309">공병 기간조회 서버 기능이 없어 주문 매출만 표시합니다.</p>` : ""}${vl.error ? `<p style="color:#b91c1c">${esc(vl.error)}</p>` : ""}
    <p><b>${esc(vl.from)} ~ ${esc(vl.to)} (한국시간)</b>${!ready && !vl.missing ? " · 공병 내역 불러오는 중" : ""}</p>
    ${vlSummaryHtml(c)}</article>
    <article class="item"><h3>업소별</h3>${c.rows.length ? vlTableHtml(c) : "<p>해당 기간 내역 없음</p>"}</article>`;
  const $ = id => document.getElementById(id);
  $("vlMode").onchange = e => { vl.mode = e.target.value; if (vl.mode === "quarter") { vlSetQuarter(vl.qYear, vl.q); vl.key = ""; vl.report = null; } renderVatLedger(); };
  document.querySelectorAll("[data-vlq]").forEach(b => b.onclick = () => {

    vl.mode = "quarter"; vlSetQuarter(y, Number(b.dataset.vlq)); vl.key = ""; vl.report = null; renderVatLedger();
  });
  $("vlQuery").onclick = () => {
    if (vl.mode === "quarter") {
      const y = parseInt($("vlQYear").value, 10);
      if (!(y >= 2020 && y <= 2100)) return alert("연도를 확인해 주세요.");
      vlSetQuarter(y, vl.q);
    } else if (vl.mode === "month") {
      const a = $("vlFrom").value, b = $("vlTo").value;
      if (!/^\d{4}-\d{2}$/.test(a) || !/^\d{4}-\d{2}$/.test(b)) return alert("시작 월과 끝 월을 입력해 주세요.");
      const [y, m] = b.split("-").map(Number);
      vl.monthFrom = a; vl.monthTo = b; vl.from = a + "-01"; vl.to = b + "-" + String(new Date(Date.UTC(y, m, 0)).getUTCDate()).padStart(2, "0");
    } else { vl.from = $("vlFrom").value; vl.to = $("vlTo").value; }
    if (!vl.from || !vl.to || vl.from > vl.to) return alert("시작일과 종료일을 확인해 주세요.");
    vl.key = ""; vl.report = null; renderVatLedger();
  };
  $("vlCsv").onclick = () => vlDownload(c);
  $("vlPrint").onclick = () => doPrint(`<h2 style="margin:0">미래몰 매입·매출 (공병·공박스 포함)</h2><p>${esc(vl.from)} ~ ${esc(vl.to)} (한국시간)</p>${vlSummaryHtml(c)}${vlTableHtml(c)}<p style="font-size:10px">${VL_LAW}</p>`, "A4 landscape");
}
function vlCsvText(c) {
  const safe = v => { let s = String(v == null ? "" : v); if (typeof v === "string" && /^[\s]*[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const rows = [["기간(KST)", vl.from + " ~ " + vl.to], VL_HEAD, ...c.rows.map(vlRow), vlRow(c.total), [], ["참고", VL_LAW]];
  return "\uFEFF" + rows.map(r => r.map(safe).join(",")).join("\r\n") + "\r\n";
}
function vlDownload(c) {
  const blob = new Blob([vlCsvText(c)], { type: "text/csv;charset=utf-8;" }), url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = "미래몰_매입매출_" + vl.from + "_" + vl.to + ".csv"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}

let evType = "none", evNo = "", evBiz = null;
const EV_NAME = { cash: "현금영수증", tax: "세금계산서", none: "필요없음" };

function htWhen(t) { return t ? new Date(t).toLocaleString("ko-KR") : ""; }
async function htSaveKv(key, value) {
  if (!cloud.ok || !cloudToken()) throw new Error("온라인 연결 필요");
  const r = await cloud.sb.rpc("mm_save", { p_token: cloudToken(), p_rows: [], p_kv: [{ key, value }], p_dels: [] });
  if (r.error) throw r.error;
  if (r.data && r.data.skipped) throw new Error("서버 권한 설정이 아직 적용되지 않았습니다");
  db[key] = value; cloud.snap = cloudSnap(db);
}
function renderHometax() {
  const req = db.hometax_request, pend = Array.isArray(db.hometax_pending) ? db.hometax_pending : [];
  document.getElementById("body").innerHTML = `
    <article class="item"><h3>현금영수증 발행 요청</h3>
      <p>${req ? `상태 <b>${esc(req.status)}</b> · ${esc(req.requested_by || "")} · ${htWhen(req.requested_at)}` : "요청 내역 없음"}</p>
      <button class="btn primary" id="htReq">현금영수증 발행 요청</button><p class="note" id="htMsg"></p></article>
    <h3 style="margin:14px 2px 6px">발행 확인</h3>
    <p class="note" style="margin-top:0">봇이 만든 목록입니다. 직원이 맞는지 확인해야 발행됩니다.</p>
    ${pend.length ? `<div class="list">${pend.map((p, i) => `
      <article class="item"><h3>${esc(p["거래처"])} <span class="badge ${p.status === "확인됨" ? "ok" : ""}">${esc(p.status || "확인 대기")}</span></h3>
        <p>주문 ${esc(p.orderId)} · ${esc(evText(p.evidence))}${(db.orders.find(o => o.id === p.orderId) || {}).evidenceIssued ? ' · <span class="badge ok">발행완료</span>' : ""}</p>
        <p>공급가액 ${won(p["공급가액"])} · 부가세 ${won(p["부가세"])} · 합계 <b>${won(p["합계"])}</b></p>
        ${p.memo ? `<p>메모: ${esc(p.memo)}</p>` : ""}
        <div class="row" style="gap:6px"><button class="btn primary" data-htok="${i}">맞음, 발행</button><button class="btn" data-htno="${i}">틀림</button><button class="btn" data-htdone="${i}">발행완료</button></div></article>`).join("")}</div>`
      : `<div class="empty">확인할 발행 목록이 없습니다.</div>`}`;
  const msg = t => document.getElementById("htMsg").textContent = t;

      render(); msg("요청 접수됨"); } catch (e) { msg("요청 실패: " + (e.message || e)); }
  };

    const list = pend.map(x => ({ ...x }));

    try { await htSaveKv("hometax_pending", list); render(); } catch (e) { alert("저장 실패: " + (e.message || e)); }
  };
  document.querySelectorAll("[data-htok]").forEach(b => b.onclick = () => mark(+b.dataset.htok, "확인됨"));
  document.querySelectorAll("[data-htno]").forEach(b => b.onclick = () => {

  });
}

const CLOUD_COLLS = ["users","categories","menus","requests","orders","posts"];

function cloudMsg(t) {
  let el = document.getElementById("cloudMsg");
  if (!el) { el = document.createElement("div"); el.id = "cloudMsg";
    el.style.cssText = "position:fixed;left:8px;right:8px;bottom:8px;z-index:9999;background:#fff3cd;color:#7a5a00;border:1px solid #e6d28a;border-radius:8px;padding:6px 10px;font-size:12px;text-align:center";

function cloudRows(d) {
  const rows = {};
  CLOUD_COLLS.forEach(c => (d[c] || []).forEach((x, i) => { if (x && x.id != null) rows[c + "\u0001" + x.id] = { coll: c, id: String(x.id), pos: i, data: x }; }));
  Object.entries(d.favorites || {}).forEach(([k, v]) => rows["favorites\u0001" + k] = { coll: "favorites", id: k, pos: 0, data: v });
  CLOUD_KV.forEach(k => { if (d[k] !== undefined) rows["kv\u0001" + k] = { kv: true, key: k, value: d[k] }; });
  return rows;
}
function cloudSnap(d) { const s = {}; Object.entries(cloudRows(d)).forEach(([k, r]) => s[k] = JSON.stringify(r)); return s; }
function cloudToken() { return localStorage.getItem("mm-token") || ""; }
let cloudQueue = Promise.resolve();
function cloudPush() {
  if (!cloud.ok || !cloudToken()) return;
  const rows = cloudRows(db), now = {}, up = [], kv = [], del = [];
  Object.entries(rows).forEach(([k, r]) => { now[k] = JSON.stringify(r);
    if (cloud.snap[k] !== now[k]) { if (r.kv) kv.push({ key: r.key, value: r.value }); else up.push({ coll: r.coll, id: r.id, pos: r.pos, data: r.data }); } });
  Object.keys(cloud.snap).forEach(k => { if (!now[k] && !k.startsWith("kv\u0001")) del.push(k.split("\u0001")); });
  cloud.snap = now;
  if (!up.length && !kv.length && !del.length) return;
  cloudQueue = cloudQueue.then(async () => {
    const r = await cloud.sb.rpc("mm_save", { p_token: cloudToken(), p_rows: up, p_kv: kv, p_dels: del });
    if (r.error) throw r.error;
    cloudMsg(""); cloudRefresh();
  }).catch(e => { console.warn(e); cloudMsg("온라인 저장에 실패했습니다. (" + (e.message || e) + ")"); });
}
async function cloudPull() {
  if (!cloud.ok || !cloudToken()) return false;
  const r = await cloud.sb.rpc("mm_fetch", { p_token: cloudToken() });
  if (r.error) { if (/AUTH/.test(r.error.message || "")) localStorage.removeItem("mm-token"); throw r.error; }

}
